<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Itachi OTP Forwarder</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen max-w-3xl items-center px-6 py-12">
      <section class="w-full rounded-2xl border border-slate-800 bg-slate-900/60 p-8 shadow-2xl shadow-black/30">
        <p class="mb-2 inline-flex rounded-full border border-emerald-500/40 bg-emerald-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-emerald-300">
          Live OTP Forwarder
        </p>
        <h1 class="text-3xl font-bold tracking-tight">Telegram OTP Relay</h1>
        <p class="mt-3 text-slate-300">
          This service fetches OTP values from the CR API and forwards them to one or more Telegram chat IDs every 30 seconds.
        </p>

        <div class="mt-6 grid gap-4 sm:grid-cols-3">
          <article class="rounded-xl border border-slate-800 bg-slate-950/70 p-4">
            <h2 class="text-sm font-semibold text-slate-200">Polling</h2>
            <p class="mt-2 text-sm text-slate-400">Runs every 30 seconds.</p>
          </article>
          <article class="rounded-xl border border-slate-800 bg-slate-950/70 p-4">
            <h2 class="text-sm font-semibold text-slate-200">Delivery</h2>
            <p class="mt-2 text-sm text-slate-400">Sends OTP-only updates to Telegram.</p>
          </article>
          <article class="rounded-xl border border-slate-800 bg-slate-950/70 p-4">
            <h2 class="text-sm font-semibold text-slate-200">Multi-chat</h2>
            <p class="mt-2 text-sm text-slate-400">Supports comma-separated chat IDs.</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
